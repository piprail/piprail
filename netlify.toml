# PipRail site — static Astro 5, built from the site/ workspace of this monorepo,
# plus one Netlify Function (site/netlify/functions/x402-demo.mjs) that serves a LIVE
# x402 endpoint at /x402/demo built with @piprail/sdk. This config stays at the repo
# root (Netlify reads it from there); everything that IS the site lives under site/.
[build]
  # Build the SDK first (its dist is what the function bundles), then the site.
  command = "npm run build:sdk && npm run build"
  publish = "site/dist"
  # Rebuild when a push touched the site, the function, the SDK, or the build wiring.
  # `scripts/` is in the list because the site's `prebuild` hook delegates into
  # scripts/sync/check.mjs — the 47-rule surface guard. A change there can fail this build,
  # so it must trigger one; otherwise the breakage stays latent until an unrelated deploy.
  #
  # 🔴 Diff against CACHED_COMMIT_REF (the last commit Netlify actually built), NOT `HEAD^`.
  # `HEAD^ HEAD` inspects only the LAST commit of a push, so a push whose final commit misses
  # every watched path SKIPS THE DEPLOY even when an earlier commit in the same push changed
  # the site. That is not hypothetical: PR #83 landed the 2.15.1 site changes in commit 1 and
  # a design-assets commit in commit 2, and piprail.com silently did not redeploy.
  # If CACHED_COMMIT_REF is unset (first build, or cache cleared) the `-z` test forces a build,
  # which is the safe default — never skip when you cannot tell.
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/ netlify.toml sdk/ scripts/ package.json package-lock.json"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "site/netlify/functions"
  node_bundler = "esbuild"
  # The SDK lazy-loads each non-EVM family's libs on first use. This endpoint is
  # Base-only, so those optional peers are never imported at runtime — keep them
  # external instead of letting esbuild try (and fail) to bundle uninstalled deps.
  external_node_modules = [
    "@aptos-labs/ts-sdk",
    "@mysten/sui",
    "@solana/spl-token",
    "@solana/web3.js",
    "@stellar/stellar-sdk",
    "@ton/core",
    "@ton/crypto",
    "@ton/ton",
    "algosdk",
    "bs58",
    "near-api-js",
    "tronweb",
    "xrpl",
  ]
