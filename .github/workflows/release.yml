name: sdk-release

# Publishes @piprail/sdk to npm when a tag matching sdk-v* is pushed
# (e.g. `git tag sdk-v1.0.0 && git push origin sdk-v1.0.0`).
# Triggered by tag only (no paths filter — paths filtering is unreliable on
# tag pushes), and gated by the package's own prepublishOnly (build + test +
# typecheck) which runs inside the workspace on publish.
on:
  push:
    tags:
      - 'sdk-v*'

jobs:
  publish:
    name: publish @piprail/sdk to npm
    runs-on: ubuntu-latest
    # `contents: write` so the same run can also cut the GitHub Release (below) —
    # one tag push → npm publish AND the release, no manual step.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Docs-sync guard — llms.txt must match the released version
        run: node site/scripts/check-sync.mjs
      - run: npm run build -w @piprail/sdk
      - run: npm publish -w @piprail/sdk --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Auto-cut the GitHub Release for this tag (the SDK is the project's `--latest` release).
      # Uses the built-in GITHUB_TOKEN — no extra secret. Notes are auto-generated from the commits
      # since the previous tag. Runs after publish; a hiccup here never un-publishes npm. Idempotent:
      # skips if a release for the tag already exists.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#sdk-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
              --title "@piprail/sdk v$VERSION" --generate-notes
          fi
