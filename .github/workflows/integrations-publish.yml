name: integrations-publish

# Publish a standalone integration package (e.g. integrations/elizaos/piprail → @piprail/elizaos-plugin)
# to npm, with provenance, using the repo's NPM_TOKEN secret (CI-grade → bypasses 2FA). These packages
# are NOT npm workspaces and have no tag-CI of their own, so this is their sanctioned publish path.
# The core @piprail/sdk + @piprail/mcp keep their own signed-tag release workflows — not here.
#
# Run it: gh workflow run integrations-publish.yml -f directory=integrations/elizaos/piprail
# Safe to re-run: it skips if that exact name@version is already on npm.
on:
  workflow_dispatch:
    inputs:
      directory:
        description: Path to the integration package to publish (must contain package.json)
        required: true
        default: integrations/elizaos/piprail

concurrency:
  group: integrations-publish-${{ inputs.directory }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance via OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve package identity
        id: pkg
        working-directory: ${{ inputs.directory }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 $NAME@$VERSION  (from ${{ inputs.directory }})"

      - name: Install, build, and gate
        working-directory: ${{ inputs.directory }}
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run typecheck
          npm run smoke

      - name: Skip if this version is already published
        id: exists
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} is already on npm — skipping publish (bump the version to release a new one)."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (with provenance)
        if: steps.exists.outputs.published == 'false'
        working-directory: ${{ inputs.directory }}
        run: |
          set +e
          OUT=$(npm publish --access public --provenance 2>&1); CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            echo "$OUT" | grep -qiE "cannot publish over|previously published|EPUBLISHCONFLICT" \
              && echo "::notice::That version is already on npm (read-API race) — treating as published." \
              || exit $CODE
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify + summarize
        run: |
          # The publish step is the source of truth (it exits non-zero on a real failure). npm's read
          # API can lag minutes behind a new scoped/provenance publish, so poll a while and then WARN
          # rather than fail — a successful publish must never show as a failed run.
          LIVE="propagating"
          for i in $(seq 1 16); do
            V=$(npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version 2>/dev/null)
            if [ -n "$V" ]; then LIVE="$V"; break; fi
            sleep 15
          done
          {
            echo "### 📦 ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}"
            echo ""
            if [ "${{ steps.exists.outputs.published }}" = "true" ]; then
              echo "Already on npm — publish skipped."
            else
              echo "Published from \`${{ inputs.directory }}\` with provenance ✅"
            fi
            echo ""
            echo "- registry read API reports version: **$LIVE**"
            echo "- npm: https://www.npmjs.com/package/${{ steps.pkg.outputs.name }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$LIVE" = "propagating" ]; then
            echo "::warning::Publish step succeeded; npm's read API is still propagating the new version (not a failure)."
          fi
