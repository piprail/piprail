name: site

# CI build check only. Deployment is handled by DigitalOcean App Platform,
# which auto-builds and deploys the site (root build command `npm run build`,
# output `site/dist`) on every push to main. This workflow just catches a
# broken site build early on PRs/pushes — no deploy, no secrets.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'

jobs:
  build:
    name: build (CI check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build -w @piprail/site
