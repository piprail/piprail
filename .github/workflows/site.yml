name: site

# CI build check only. Deployment is handled by Netlify (see netlify.toml),
# which auto-builds and publishes the site (build `npm run build`, publish
# `site/dist`) on every push to main. This workflow just catches a broken
# site build early on PRs/pushes — no deploy, no secrets.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'

jobs:
  build:
    name: build (CI check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build -w @piprail/site
