name: deploy-docs

# Builds the docs/ workspace (Astro Starlight) and deploys it to GitHub Pages at
# docs.piprail.com. Inert until GitHub Pages is enabled on this repo (Settings →
# Pages → Source = GitHub Actions) and the custom domain + DNS are set up — see
# .claude/plans/docs-site/05-implementation-checklist.md. The marketing site
# (piprail.com) is unaffected: it deploys separately via Netlify (see site.yml).
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Least-privilege tokens the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight Pages deploy at a time; let a newer push cancel an older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # Install at the workspace root (the lockfile + workspaces live here), then
      # build only the docs workspace. Astro writes static output to docs/dist.
      - run: npm ci
      # The sync guard needs the SDK's built dist to read the chain set, the facilitator
      # registry and the MCP tool list; without it those rules SKIP and the guard is weaker.
      - run: npm run build -w @piprail/sdk
      # Docs mirror the SDK. A docs edit that contradicts the code (a family page, an error
      # code, a scheme) previously published straight to docs.piprail.com unchecked.
      - name: surface-map sync guard
        run: npm run sync
      - run: npm run build -w @piprail/docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # docs.piprail.com is 91 pages — 87% of PipRail's indexable surface — and until
  # 2026-08-27 it was NEVER submitted to IndexNow (only the apex was, via indexnow.yml).
  # IndexNow feeds Bing, and Bing's index is what backs ChatGPT search + Copilot, so this
  # is the cheapest AI-visibility lever we have. Keys are per-host by key-file location:
  # the same key is reused, served from docs/public/<key>.txt on this host.
  #
  # Deploy-correlated only, never on a schedule — re-submitting unchanged URLs is an
  # IndexNow spam signal that can throttle the key.
  indexnow:
    name: ping IndexNow (docs)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Submit the live docs sitemap URLs to IndexNow
        run: |
          set +e   # best-effort: a failed ping must never red the deploy. Neutralize the runner's -e.
          HOST="docs.piprail.com"
          KEY="1a7e59a4b79dd5cf3b5c74dd6d400c27"
          SITEMAP="https://$HOST/sitemap-0.xml"

          # GitHub Pages serves the new build shortly after deploy — poll the live sitemap
          # (bounded) so we submit the freshly-deployed URL set, not a stale one.
          urls=""
          for i in 1 2 3 4 5 6; do
            sleep 20
            xml=$(curl -fsS "$SITEMAP" 2>/dev/null)
            urls=$(printf '%s' "$xml" | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g')
            [ -n "$urls" ] && break
          done
          if [ -z "$urls" ]; then echo "No sitemap URLs reachable yet — skipping (next deploy covers it)."; exit 0; fi

          count=$(printf '%s\n' "$urls" | grep -c .)
          echo "Submitting $count docs URL(s) to IndexNow..."
          body=$(printf '%s\n' "$urls" | HOST="$HOST" KEY="$KEY" python3 -c 'import os,sys,json; u=[l.strip() for l in sys.stdin if l.strip()]; print(json.dumps({"host":os.environ["HOST"],"key":os.environ["KEY"],"keyLocation":"https://%s/%s.txt"%(os.environ["HOST"],os.environ["KEY"]),"urlList":u}))')
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST 'https://api.indexnow.org/indexnow' -H 'Content-Type: application/json' -d "$body")
          echo "IndexNow responded HTTP $code  (200 or 202 = accepted)."
          exit 0
