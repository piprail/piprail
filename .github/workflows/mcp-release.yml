name: mcp-release

# Publishes @piprail/mcp to npm when a tag matching mcp-v* is pushed
# (e.g. `git tag mcp-v0.1.0 && git push origin mcp-v0.1.0`).
# Triggered by tag only, and gated by the package's own prepublishOnly
# (build + typecheck + test) which runs inside the workspace on publish.
#
# After npm publish, this workflow ALSO (1) cuts the GitHub Release and (2) refreshes the MCP
# Registry entry (io.github.piprail/mcp) — FULLY AUTOMATIC, NO STORED SECRET. The registry step
# authenticates with GitHub Actions OIDC (`mcp-publisher login github-oidc`): the runner's OIDC token
# is trusted by the registry for the `io.github.piprail` namespace (matched by repository_owner), so
# no PAT and no manual device-flow login is ever needed. See .claude/skills/deploy/SKILL.md §8.
on:
  push:
    tags:
      - 'mcp-v*'

jobs:
  publish:
    name: publish @piprail/mcp to npm + registry
    runs-on: ubuntu-latest
    permissions:
      contents: write   # cut the GitHub Release
      id-token: write   # GitHub OIDC → MCP registry auth (no stored secret)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Docs-sync guard — llms.txt must match the released version
        run: node site/scripts/check-sync.mjs
      # @piprail/mcp's type-declaration build (and its prepublishOnly typecheck +
      # tests) resolve @piprail/sdk's built types/dist, which aren't committed —
      # build the SDK first so they exist in the clean CI checkout.
      - run: npm run build -w @piprail/sdk
      - run: npm run build -w @piprail/mcp
      - run: npm publish -w @piprail/mcp --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Auto-cut the GitHub Release (MCP releases are NOT `--latest` — the SDK holds that).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#mcp-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false \
              --title "@piprail/mcp v$VERSION" --generate-notes
          fi
      # Refresh the MCP Registry listing (io.github.piprail/mcp) via GitHub Actions OIDC — NO secret.
      # The runner's OIDC token authenticates to the registry for the io.github.piprail namespace
      # (matched by repository_owner). Runs AFTER npm publish so the referenced package exists.
      # Best-effort: a registry hiccup never fails the release (npm + Release are already done).
      - name: Publish to the MCP Registry (OIDC — no secret)
        continue-on-error: true
        run: |
          curl -sSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          cd mcp
          ../mcp-publisher login github-oidc
          ../mcp-publisher publish
