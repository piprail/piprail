# PipRail funding rails — surfaces the "Sponsor" button on the GitHub repo.
# GitHub reads this file ONLY from the default branch (main), so it lives here.
#
# Activate each line as you create the account (see .claude/research/outreach-runbook.md Phase 0
# + .claude/research/contacts.md §10). Keep every handle VALID — a wrong/unenrolled handle breaks
# the Sponsor button, so the others below stay commented until their account exists.

# --- Active now ---
# site + Drips. Drips ✅ claimed via FUNDING.json at the repo root (it has no native
# FUNDING.yml key, so its project URL rides under `custom`).
custom: ['https://piprail.com', 'https://www.drips.network/app/projects/github/piprail/piprail']

# --- GitHub Sponsors: APPROVED + PUBLIC, verified 2026-08-30 ---
# gh api graphql -> hasSponsorsListing: true, sponsorsListing.isPublic: true
# It had been live and commented out here since ~June, so the Sponsor button never showed it.
github: [John-Weeks-Dev]

# --- Open Collective: NOT approved. Do NOT uncomment ---
# Verified 2026-08-30 via api.opencollective.com: isApproved:false, isActive:false, host:null.
# The 2026-06-07 submission was never accepted by a fiscal host — it is rejected, not queued.
# Re-apply to Open Source Collective, and only uncomment once isApproved flips true
# (a not-yet-approved handle breaks the whole Sponsor button).
# open_collective: piprailhq
