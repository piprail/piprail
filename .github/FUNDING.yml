# PipRail funding rails — surfaces the "Sponsor" button on the GitHub repo.
# GitHub reads this file ONLY from the default branch (main), so it lives here.
#
# Activate each line as you create the account (see research/outreach-runbook.md Phase 0
# + research/contacts.md §10). Keep every handle VALID — a wrong/unenrolled handle breaks
# the Sponsor button, so the others below stay commented until their account exists.

# --- Active now: routes interested sponsors to the project ---
custom: ['https://piprail.com']

# --- Uncomment each once set up (one human step each — needs your login/Stripe/wallet) ---
# github: [piprail]            # after enabling GitHub Sponsors (github.com/sponsors) on this account
# open_collective: piprail     # your Open Collective slug, after opencollective.com/opensource/apply
#
# Drips has NO native key — after you claim the repo on Drips, add its URL to `custom` above:
#   custom: ['https://piprail.com', 'https://www.drips.network/app/projects/github/piprail/piprail']
