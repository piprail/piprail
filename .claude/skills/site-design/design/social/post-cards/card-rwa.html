<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="../../video/assets.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#000;--fg:#fafafa;--muted:#8b9298;--line:rgba(255,255,255,.08);--em:#2ee6a6;}
  html,body{width:1080px;height:1080px;background:#000;}
  #card{position:relative;width:1080px;height:1080px;background:var(--bg);overflow:hidden;
    font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;color:var(--fg);padding:70px 72px;
    display:flex;flex-direction:column;}
  .g{position:absolute;border-radius:50%;filter:blur(140px);z-index:0;}
  .g1{width:900px;height:600px;left:-160px;top:-220px;background:rgba(46,230,166,.12);}
  .g2{width:760px;height:560px;right:-160px;bottom:-220px;background:rgba(46,230,166,.06);}
  #card>*{position:relative;z-index:2;}
  .brand{display:flex;align-items:center;gap:18px;margin-bottom:34px;}
  .brand img{width:64px;height:64px;border-radius:16px;}
  .brand b{font-size:46px;font-weight:800;letter-spacing:-.02em;}
  .brand .em{color:var(--em);}
  h1{font-weight:900;letter-spacing:-.025em;font-size:74px;line-height:1.02;margin-bottom:18px;}
  h1 .em{color:var(--em);}
  .sub{font-size:30px;color:var(--muted);font-weight:500;line-height:1.36;margin-bottom:42px;max-width:940px;}
  .sub b{color:#dfe3e7;font-weight:600;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 24px;flex:1;align-content:center;}
  .ct{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .tile{position:relative;width:132px;height:132px;border-radius:30px;overflow:hidden;
    border:1px solid var(--line);background:#0c0d10;box-shadow:0 14px 36px -14px #000;}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;}
  .chk{position:absolute;right:-8px;bottom:-8px;width:46px;height:46px;border-radius:50%;
    background:var(--em);border:4px solid #000;display:flex;align-items:center;justify-content:center;
    color:#001a12;font-weight:900;font-size:26px;}
  .nm{font-size:23px;font-weight:600;color:#d7dbdf;}
  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:40px;
    font:600 25px 'JetBrains Mono',monospace;color:var(--muted);}
  .foot .em{color:var(--em);} .foot b{color:#fafafa;font-weight:700;}
</style>
</head>
<body>
<div id="card">
  <div class="g g1"></div><div class="g g2"></div>
  <div class="brand"><img id="logo" alt=""><b>Pip<span class="em">Rail</span></b></div>
  <h1>Already live where the <span class="em">money flows.</span></h1>
  <div class="sub"><b>8 of the top 10</b> chains by RWA net flows — accept an x402 payment in one line, in USDC, straight to your wallet. No backend, no fee.</div>
  <div class="grid" id="grid"></div>
  <div class="foot"><span>x402 · one line · <b>28 chains</b> total</span><span class="em">piprail.com</span></div>
</div>
<script>
  const A=window.ASSETS;
  document.getElementById('logo').src=A.logo;
  const CHAINS=[['stellar','Stellar'],['solana','Solana'],['xrpl','XRP Ledger'],['aptos','Aptos'],
                ['avalanche','Avalanche'],['polygon','Polygon'],['ethereum','Ethereum'],['bnb','BNB Chain']];
  const g=document.getElementById('grid');
  for(const [slug,name] of CHAINS){
    const ct=document.createElement('div'); ct.className='ct';
    ct.innerHTML=`<div class="tile"><img src="${A.chains[slug]}"><div class="chk">✓</div></div><div class="nm">${name}</div>`;
    g.appendChild(ct);
  }
  window.__ready=document.fonts.ready;
</script>
</body>
</html>
