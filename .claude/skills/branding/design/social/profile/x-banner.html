<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1500px; height: 500px; }
  .banner {
    width: 1500px; height: 500px; position: relative; overflow: hidden;
    background: #000;
    font-family: 'Inter', sans-serif; color: #fafafa;
    display: flex; align-items: center; justify-content: center;
  }
  .lockup { position: relative; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; }
  .row { display: flex; align-items: center; gap: 32px; }
  .mark {
    width: 132px; height: 132px; border-radius: 30px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
  }
  .word {
    font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
    font-weight: 700; font-size: 112px; letter-spacing: -3.5px; line-height: 1;
    background: linear-gradient(180deg, #ffffff 0%, #c9cdd1 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tag { font-weight: 500; font-size: 35px; color: #aab0b6; letter-spacing: -0.4px; }
  .chips {
    display: flex; align-items: center; gap: 20px;
    font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 23px; color: #868d93;
    margin-top: 2px;
  }
  .chips b { color: #2ee6a6; font-weight: 700; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: #2ee6a6; opacity: 0.85; }
</style>
</head>
<body>
  <div class="banner">
    <div class="lockup">
      <div class="row">
        <img class="mark" src="logo.png" alt="PipRail">
        <div class="word">PipRail</div>
      </div>
      <div class="tag">The payment layer for the agent economy</div>
      <div class="chips">
        <span><b>x402</b>&nbsp;payments for AI agents</span>
        <span class="dot"></span>
        <span>every chain</span>
        <span class="dot"></span>
        <span>self-custodial</span>
        <span class="dot"></span>
        <span>no backend, no fee</span>
      </div>
    </div>
  </div>
</body>
</html>
